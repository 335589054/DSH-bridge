# 本文件由 sync-models.mjs 生成，请勿手改。
# 第一行给 UI 半体挂一个可寻址的行；后面是 llm-pi-ai 的 workbuddy 路由。
- insert:
    - id: workbuddy-ui
      name: 'dsh-plugin-workbuddy'
# >>> dsh-plugin-workbuddy (managed) >>>
# 本块由 dsh-plugin-workbuddy 生成，重装或同步模型时整块替换，请勿手改。
- id: llm-pi-ai
  name: '@deepseek-ai/dsh-llm-pi-ai'
  config:
    providers:
      workbuddy:
        displayName: 'WorkBuddy'
        api: openai-completions
        baseURL: 'http://127.0.0.1:8790/v1'
        apiKeyEnv: 'WORKBUDDY_BRIDGE_TOKEN'
        # 上游把思考内容放在 reasoning_content，按 deepseek 方言解析
        compat:
          thinkingFormat: deepseek
        models:
          - id: 'auto'
            name: 'Auto（自动选择）'
          - id: 'deepseek-v4.1-flash'
            name: 'DeepSeek V4.1 Flash'
          - id: 'deepseek-v4-pro'
            name: 'DeepSeek V4 Pro'
          - id: 'glm-5.3'
            name: 'GLM 5.3'
          - id: 'glm-5.3-flash'
            name: 'GLM 5.3 Flash'
          - id: 'glm-5.2'
            name: 'GLM 5.2'
          - id: 'glm-5.1'
            name: 'GLM 5.1'
          - id: 'glm-5v-turbo'
            name: 'GLM 5V Turbo'
          - id: 'kimi-k3-1'
            name: 'Kimi K3.1'
          - id: 'kimi-k2.8-preview'
            name: 'Kimi K2.8 Preview'
          - id: 'minimax-m3'
            name: 'MiniMax M3'
          - id: 'hy3'
            name: '混元 3'
          - id: 'hy3-x'
            name: '混元 3 X'
          - id: 'hy4-preview'
            name: '混元 4 Preview'
          - id: 'hy4-preview-f'
            name: '混元 4 Preview F'
